[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200

# Keeps the Remix-style versioned import in FunctionsConsumer.sol working unchanged.
remappings = [
    "@chainlink/contracts@1.3.0/=lib/chainlink-brownie-contracts/contracts/",
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@cre/=cre/contracts/evm/src/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# Chainlink uses the s_ storage prefix and raw hex DON IDs deliberately.
[lint]
exclude_lints = ["mixed-case-variable", "too-many-digits"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
